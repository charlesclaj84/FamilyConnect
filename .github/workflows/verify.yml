# Everything that must be true before a merge is allowed to apply migrations to the
# production database. Nothing here touches a hosted project.
#
# The point of this file is that migrate.yml applies migrations UNATTENDED on merge to
# master. That is only safe if the chain has been proved to apply to an empty database
# first, which AGENTS.md has always asked for ("Verify with `npx supabase db reset`, not
# by reading") and which nothing has ever enforced.

name: Verify

on:
  pull_request:
  push:
    branches: [dev]

# A second push to the same PR asks the same question again, so abandon the first run.
# Production migrations are the opposite case — see the note in migrate.yml.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, for one step: `sitemap:check` compares the sitemap's hand-typed
          # `lastModified` against the newest commit touching the public pages, and the default
          # `fetch-depth: 1` gives one commit and no history to compare against. The script
          # SKIPS loudly rather than failing on a shallow clone, so without this line the step
          # goes green having checked nothing — which is the failure mode that made the stamp
          # nine days stale in the first place.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Matches the version used locally, so a green run here and a green run on a
          # laptop mean the same thing.
          node-version: 24
          cache: npm

      - run: npm ci

      # First, because it needs no database and no network, and it catches the two
      # mistakes that would make everything below meaningless: a file the CLI silently
      # skips, and a file that documents itself as a hand-run `psql` command.
      - name: Migration chain checks
        run: npm run db:check

      # ADDED 2026-08-17, and worth saying why it was not here before: it simply was not.
      # AGENTS.md §7b describes `npm test` as one of the repo's two real runners — vitest over
      # the pure modules under `lib/` — and it has been laptop-only since the day it was
      # written, which means every assertion in it (`lib/dues-utils.test.ts`,
      # `lib/help/inline.test.ts`) gated exactly nothing on a pull request. A test nobody runs
      # is a comment. Needs no database and no network, so it sits with the other cheap checks.
      - name: Unit tests
        run: npm test

      # The manual, checked mechanically. Same shape and same reason as `db:check` above: no
      # database, no network, exits 1 on a finding. It cannot check that a chapter still
      # describes its screen — nothing can — but it removes the mechanical half from a
      # reviewer's attention so the unmechanical half gets it.
      - name: Help manual checks
        run: npm run help:check

      # The other direction of the same idea: the manual documents every live screen, and this
      # asserts the marketing CATALOGUE names every live screen. The gap only ever opens one
      # way — a feature ships, the registry gains a row, and `/features` does not — so the
      # product undersells itself silently. Eleven live screens were named nowhere when this
      # was first run, including three whole sections.
      #
      # It CANNOT check the pricing cards. A pricing bullet is prose about a benefit and
      # corresponds to no route (see the header above `PLANS[]`), so those stay a judgement and
      # live in FutureFeature.md. No database, no network, exits 1 on a finding.
      - name: Every live feature is sold somewhere
        run: npm run marketing:check

      # The sitemap's date, which is the one part of it that can rot. Route COVERAGE is derived
      # from `MARKETING_ROUTES` and cannot drift; `lastModified` is a literal, deliberately (a
      # `new Date()` there would stamp build time and a date that moves every deploy is one
      # crawlers learn to ignore). It read 2026-08-12 until 2026-08-21, across the Events
      # retirement and the Standard tier — so the reminder is a step rather than a comment.
      #
      # Depends on `fetch-depth: 0` above. Needs no database and no network.
      - name: Sitemap freshness
        run: npm run sitemap:check

      # Phase 3's third leftover, turned from a rule into a gate. The two `people` guards
      # bound the ROLE the browser speaks as, not the column — deliberately, because
      # link-person and the RLS fixture both need the service role to move
      # `membership_status`. That left "any new service-role write to `people` owes the same
      # look" as prose in AGENTS.md, which is only ever as good as the next person having
      # read it. This fails until the new write has a stated verdict against the three
      # questions. Static; no database, no network.
      - name: Service-role writes to `people` are reviewed
        run: npm run audit:people

      # The generalisation of the step above, added 2026-08-20. §3's rule is that every query
      # through the service role must re-apply by hand what a policy would have done, and it
      # has been broken four times now — never by disagreement, always by a query in a file
      # nobody was thinking of as part of the feature. `deleteRegion` and `deleteChapter` had
      # `.eq('id', id)` as their whole predicate; `revokeRoleByAssignmentId` was the same hole
      # a day later; `addGroupMember` gated on `created_by === user.id`, which authorizes the
      # action and says nothing about which family's room it acts on. This fails until a new
      # unscoped query has a stated verdict. Static; no database, no network.
      - name: Service-role queries are family-scoped
        run: npm run audit:family-scope

      # The third of the static audits, added 2026-08-22, and the one that gates the RLS suite
      # rather than the code. §7 says "adding an action means adding a case" and nothing
      # enforced it, so the gap was invisible by construction: an action with no case does not
      # fail and does not warn. It was only ever found by somebody deciding to count, which had
      # happened once, by hand, and produced the wrong number — FutureFeature.md carried "167
      # server actions have no RLS case" against a real figure of 57, because the hand count
      # matched `fn:` and missed the `read(id, mod, fn)` helper form most of the suite is
      # written in.
      #
      # Same promise as the two above and no more: it checks that a verdict EXISTS, never that
      # it is true. What it adds beyond an inventory is a RATCHET — the backlog cannot grow, so
      # a new action ships with a case or with somebody deciding in public that the debt should
      # get bigger. Static; no database, no network.
      - name: Every server action has an RLS case or a stated verdict
        run: npm run audit:rls-cases

      # The fourth static audit, added 2026-08-26 with the timezone work. There are two kinds
      # of time in the product and the bug is one being handled as the other: `formatDate` does
      # string surgery on its argument, so handing it a `timestamptz` prints the UTC calendar
      # date. Ten call sites did exactly that -- Payment History, Transactions, Documents,
      # Officer Notes -- and every row entered after 7pm Central was filed a day late, with
      # nothing to report it: the date rendered, it was plausible, and it was wrong.
      #
      # Also catches `toLocale*` and an `Intl.DateTimeFormat` with no `timeZone`, both of which
      # resolve to whichever zone the RUNTIME is in -- the browser's in a client component and
      # UTC on the server, so one row renders two ways depending on which side drew it.
      #
      # Same promise as the three above: it checks that a verdict EXISTS, never that it is true.
      # It also fails on a STALE verdict, because an entry left behind after its call site was
      # fixed is a claim about code that no longer exists. Static; no database, no network.
      - name: Every rendered time is a label or a zoned instant
        run: npm run audit:time

      # The fifth static audit, added 2026-08-26 with the translation catalogue. Four of its five
      # findings are ordinary hygiene; the fifth is the one nothing else can see. `marketing:check`
      # already gates that the SET of plan claims matches per tier and cannot tell whether a
      # bullet's words still say the true thing — and the same gap opens for every string the
      # moment a second language exists: somebody edits the English, does not touch the other
      # catalogues, and that page renders a fluent sentence that is no longer true.
      #
      # So every translation records a hash of the English it was made from, and this reports a
      # mismatch as STALE, by name. It also catches a key used and not defined (which renders as
      # the key itself), a key nobody reads (a string somebody is asked to translate for no
      # reason), an orphan, and a placeholder a translation invented (which renders literally).
      #
      # It cannot judge whether a translation is any good. Static; no database, no network.
      - name: Every translation key is defined, used and current
        run: npm run i18n:check

      - uses: supabase/setup-cli@v1
        with:
          # Pinned. This is the version that will also apply migrations to production in
          # migrate.yml, and `npx supabase` without a pin fetches whatever npm served that
          # day — an unreviewed CLI upgrade between two deploys is not a thing to discover
          # from a schema change.
          version: 2.114.0

      # Applies every migration to an EMPTY database, in order, then runs seed.sql. A
      # migration that only works against a database already carrying yesterday's schema
      # fails right here. `20260618000002` is an empty file precisely because of this
      # constraint; nothing but a real run from empty proves the chain still holds.
      - name: Start the stack — applies the chain to an empty database
        run: supabase start

      # And again, with the command AGENTS.md tells a human to run.
      - name: supabase db reset
        run: supabase db reset

      - name: Ledger is level with the repo
        run: npm run db:check -- --local --expect-applied

      # A superseded policy sitting beside its `perm:` replacement. Here this proves the
      # REPO's chain cannot produce one; migrate.yml asks the same question of hosted,
      # where the cause would be a hand-run file instead.
      - name: No superseded policy beside its replacement
        run: supabase db query --local -f supabase/scripts/audit_policy_shadowing.sql

      # The family-isolation suite. It reads its keys from `supabase status`, so there is
      # nothing to inject, and it refuses to run against a non-local URL.
      - name: RLS isolation suite
        run: npm run test:rls

      # BLOCKING since 2026-08-12, when the 39 pre-existing errors were cleared. It was
      # `|| true` before that, because blocking on a baseline of 39 fails every PR from the
      # first one and teaches everybody that a red tick is normal.
      #
      # AND A WARNING FAILS IT TOO, since 2026-08-20. `npm run lint` is
      # `eslint --max-warnings 0`, so the flag lives in package.json rather than here — one
      # place, and a laptop run gives the same answer CI does.
      #
      # This said "30 WARNINGS REMAIN AND DO NOT FAIL THIS", and named
      # `react-hooks/incompatible-library` as the group that had to be triaged first: React
      # Compiler's correct objection to react-hook-form's `watch()`, which cannot be
      # memoized safely. That group is gone — every form needing a live field value uses
      # `useWatch`, which is a real hook (see the long note under the imports in
      # `PersonalInfoForm`, because the cost of `watch()` was never the line it appeared on:
      # the compiler skips the WHOLE component). The unused-vars are cleared, and the three
      # `no-img-element` sites carry a targeted disable with the reason written beside it.
      #
      # WHAT THAT BUYS is that a new warning cannot accumulate quietly. What it costs is
      # that a rule which fires on legitimate code now needs a disable and a sentence saying
      # why — which is the trade taken deliberately, and is why those three sites read the
      # way they do rather than being silenced from here.
      - name: Lint
        run: npm run lint

      # `npm run typecheck` GENERATES BEFORE IT CHECKS — `next typegen && tsc --noEmit`
      # — and that first half is what makes this step mean anything here.
      #
      # `next-env.d.ts` is gitignored, on Next's own recommendation, and it is the file
      # carrying `/// <reference types="next/image-types/global" />`. So in a fresh
      # checkout it does not exist, non-code imports have no declarations, and the three
      # static PNG imports in components/marketing/pillars.ts fail with TS2307 — while a
      # laptop that has ever run `next dev` or `next build` passes, because both commands
      # write that file. This step was red on every push to dev for four commits for
      # exactly that reason, and nobody could reproduce it locally.
      #
      # `next typegen` writes `next-env.d.ts` and `.next/types/` without a full build, in
      # about a second. It lives in the npm script rather than in a step of its own so the
      # command a person runs on a laptop and the command CI runs are the same command —
      # which is the only arrangement in which a green run here and a green run there mean
      # the same thing.
      #
      # This step can therefore stay ABOVE Build, which is where it belongs: a type error
      # should be reported by the step named Typecheck, not by a build failing four
      # minutes later.
      - name: Typecheck
        run: npm run typecheck

      # The build needs the three env vars the Supabase clients read. They come from the
      # stack already running in this job rather than from placeholders, so a route that
      # touches Supabase during prerender fails here rather than on Vercel.
      #
      # `eval` is scoped to three known keys by the grep, and `supabase status` exits
      # non-zero when any optional container is down, which is not a build failure — hence
      # the `|| true`.
      - name: Build
        run: |
          eval "$(supabase status -o env 2>/dev/null | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' || true)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npm run build
