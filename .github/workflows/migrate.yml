# How migrations reach the hosted project, and the gate that decides whether the code
# built from this commit is allowed to serve it.
#
# THE TWO INCIDENTS THIS EXISTS TO PREVENT
#
#   1. Code shipped ahead of schema. The dev server points at hosted, and Phase 3's app
#      code was deployed while its migrations were still pending. `getMyFamilies` selected
#      `membership_status`; hosted did not have the column; PostgREST answered 42703 and
#      killed the WHOLE query, not just that column. The resolver returned no memberships,
#      `requireViewOrPending` called `notFound()`, and every page in the app answered 404
#      — including the dashboard.
#
#   2. A migration was replayed by hand. `20260602000000_families.sql` was run against
#      hosted after `20260618000001` had renamed its policy to `perm:…`. Its bare
#      `CREATE POLICY` recreated the original alongside the secure one, and because
#      permissive policies are OR-ed, the spoofable `user_metadata` policy decided every
#      read until Supabase's advisor caught it.
#
# HOW ORDERING IS GUARANTEED — AND WHY IT IS NOT A DEPLOY HOOK
#
#   This workflow does NOT deploy anything. Vercel builds every push to `master` as usual,
#   and **Vercel Deployment Checks** hold that build unaliased until this job passes:
#
#     push to master ─┬─> Vercel builds a production deployment (NOT serving traffic)
#                     └─> this job: apply migrations, audit, sync the auth email copy
#                              │
#                         pass ├─> Vercel aliases the build to genorra.com, automatically
#                         fail └─> never aliased; the current production keeps serving
#
#   So the old code serves while migrations are applied — the safe direction, because a
#   migration this repo ships is additive and the running code does not use it yet — and
#   the new code is released only once the schema it needs is there.
#
#   The first design fired a Vercel deploy hook from the end of this job instead, with
#   Vercel's git auto-deploy for `master` turned off. That does not work, and the reason is
#   worth keeping so nobody rebuilds it: **deploy hooks are part of Vercel's git
#   integration.** Turn git deployments off and the hook stops firing too (the docs say so
#   for `github.enabled`, and Vercel support says so for the feature generally), so the
#   arrangement has only two states — auto-deploy on and the hook deploying a redundant
#   second time, or auto-deploy off and nothing deploying at all. Deployment Checks are the
#   supported mechanism for gating a release, and they require automatic aliasing to stay
#   **ON**, which is the opposite of what a hook needs.
#
#   Replay, meanwhile, is structural for a different reason: `supabase db push` records each
#   version in `supabase_migrations.schema_migrations` and refuses one already there.
#   Running it from here and nowhere else is what makes that ledger the truth. Guarding ~30
#   migration files individually was the alternative, and it is only ever as complete as the
#   last person's diligence.
#
#   Nobody needs write credentials on a laptop for any of this.

name: Migrate

# ONE TRIGGER, DELIBERATELY. A merge to `master` is the only thing that may apply
# migrations to production, so `refs/heads/master` is the only ref that can ever reach the
# credentials scoped to the `production` environment below.
#
# RETRYING A FAILED RUN needs neither a second trigger nor an empty commit: use "Re-run all
# jobs" on the run itself. There is one job here, so that is the only kind of re-run there
# is. GitHub replays it against the same commit SHA and ref, which is the property that
# matters — the fresh `Database migrations` check-run lands on the very commit whose
# production build Vercel is holding. A `workflow_dispatch` could not promise that: it runs
# against whatever the tip of `master` is when you press it, so its status could land on a
# different commit from the held build's. The dispatch trigger was removed on 2026-08-17 for
# that reason and because nothing had ever exercised it.
#
# Re-running the whole job is safe because every step is either read-only, keyed on the
# ledger, or — in the one case that is neither — keyed on the tip of `master`. `db push`
# refuses a version `supabase_migrations.schema_migrations` already records, so a re-run
# resumes at the file that failed, and `--expect-applied` still has to pass afterwards. The
# exception is the auth email template push, which writes to hosted from the checked-out tree
# and would therefore revert a NEWER commit's templates on a re-run of an older one; it
# compares `GITHUB_SHA` against `origin/master` and skips itself when it is not the tip. See
# that step. Secrets are read at job start, so the most likely failure of all — a
# rotated token tripping the preflight below — is fixed on the environment and then re-run,
# with no commit at all.
#
# WHAT A RE-RUN CANNOT FIX is anything the commit itself caused. It replays the same files,
# so a bad migration, a chain-ordering refusal or a policy-shadowing finding needs a new
# commit — which triggers a run here by itself. And if a re-run's status does not release the
# held build, `Force Promote` on the deployment is the escape hatch; see the Release step at
# the end of this file. That last sentence is deliberately not stated as a certainty, for the
# same reason the dispatch path never should have been: GitHub's re-check behaviour is read
# from the docs here, not observed.
on:
  push:
    branches: [master]

# NEVER cancel a run that might be mid-`db push`. Two merges in quick succession must
# queue, not race — an interrupted push leaves the ledger disagreeing with the schema.
concurrency:
  group: production-migrate
  cancel-in-progress: false

jobs:
  migrate:
    # PINNED DELIBERATELY. Vercel identifies a Deployment Check by the GitHub check-run
    # name, which is this string — so it is the name to select in the project's Deployment
    # Checks settings, and renaming it silently detaches the gate, leaving every production
    # build waiting on a check that no longer reports. The docs call this out: "Changing
    # the name of a job requires updating your Deployment Checks to align with the names."
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The two production credentials live on THIS environment, not on the repository.
    # Repository secrets are readable by every workflow in the repo — including verify.yml,
    # which runs on `pull_request` from any branch a collaborator can push. verify.yml needs
    # no secret at all (checked: zero `secrets.` references), so scoping them here costs
    # nothing and means a PR cannot reach the production database password even by editing
    # its own workflow file.
    #
    # Set this environment's deployment branch rule to `master` as well. The rule binds these
    # credentials to a REF rather than to this file's trigger list, which is what keeps them
    # out of reach of a workflow file living on a branch — whatever its author wrote it to run
    # on. There is no such workflow today and no trigger here but a push to `master`; the rule
    # is what makes that a property of the environment rather than of nobody having added one.
    #
    # Side benefit worth having: every run records a deployment against the environment, so
    # the Environments tab becomes the history of what reached production and when — the
    # "recorded" half of what this mechanism was for.
    environment: production

    env:
      # A Management API token (sbp_…) — not the service role key, not the DB password.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Read by `supabase link` and `db push` so neither prompts.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      # Fail with a sentence rather than with a CLI error forty lines down. A missing
      # secret is the single most likely reason this workflow breaks after somebody
      # rotates a token.
      #
      # The message names WHERE to fix it rather than pointing at a file. It used to send the
      # reader to TODO.md's GO LIVE checklist, which names none of these three — a dangling
      # pointer that cost nothing until the retry story started leaning on it ("set the
      # secret, then re-run"). All three live on the environment, not in this repo, so the
      # repo is the one place that cannot answer the question.
      - name: Preflight — required secrets are present
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ]  || missing="$missing SUPABASE_DB_PASSWORD(secret)"
          [ -n "$PROJECT_REF" ]           || missing="$missing SUPABASE_PROJECT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing — set these on Settings → Environments →" \
                 "production (secrets and variables), then use \"Re-run all jobs\" on this run." \
                 "Nothing needs committing."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # Same pin as verify.yml. Keep them in step: the CLI that proved the chain on a
          # PR should be the CLI that applies it to production.
          version: 2.114.0

      - name: Migration chain checks
        run: npm run db:check

      - name: Link
        run: supabase link --project-ref "$PROJECT_REF" --yes < /dev/null

      # Before touching anything: does hosted carry a version this repo does not (a
      # hand-applied file, or a `migration repair` stamp), and does anything pending sort
      # before what is already applied? Both are reasons to stop rather than push.
      - name: Ledger before
        run: npm run db:check -- --linked

      - name: What would be applied
        run: supabase db push --linked --dry-run --yes < /dev/null

      # `--yes` AND `< /dev/null`, and neither is decoration.
      #
      # `supabase db push --linked` DOES NOTHING FROM A NON-TTY — exit 0, no output, no
      # migrations applied — because it is sitting on a confirmation prompt it cannot
      # draw. AGENTS.md has recorded that since before this workflow existed, and a
      # GitHub runner is exactly that non-TTY. Without these, this job would go green
      # having applied nothing, the Deployment Check would pass, and Vercel would release
      # code against a schema that never changed: Phase 3's outage, reproduced faithfully
      # by the automation built to prevent it.
      #
      # NO --include-all, ever. `db push` refuses a pending migration that sorts before
      # the last one applied, and that refusal is a guard rather than an inconvenience:
      # every file applied after it was written against a schema that did not include it.
      # When it fires, the repair is a new migration with a current timestamp.
      - name: Apply migrations
        run: supabase db push --linked --yes < /dev/null

      # LOAD-BEARING, not a formality. This is what catches the silent no-op described
      # above if a future CLI reintroduces it in some other form: it re-reads the ledger
      # and fails when anything this repo carries is still pending. Failing here keeps the
      # Deployment Check red, so the build stays unaliased.
      - name: Ledger after — nothing may still be pending
        run: npm run db:check -- --linked --expect-applied

      # The check for incident 2, asked of hosted. A finding here holds the release with
      # schema applied and the old code still serving — the safe direction, since a
      # migration this repo ships is additive and the running code does not use it yet.
      #
      # The pinned binary directly, not `npm run db:audit`, which goes through `npx`.
      # The npm script is the convenience for a laptop; nothing that gates production
      # should depend on npx preferring a PATH command over fetching its own copy.
      - name: No superseded policy beside its replacement
        run: supabase db query --linked -f supabase/scripts/audit_policy_shadowing.sql

      # ADDED 2026-08-17. The check for a THIRD incident, and the one nothing in the
      # repo can see: three tables in `public` are product reference data seeded only
      # by migrations, and `truncate_entire_database.sql` emptied all four on hosted.
      # A migration a database has already recorded as applied never runs again, so
      # there is no route back but a new migration — and `db reset` re-seeds a laptop
      # from the original files, so local was always right and only production was
      # ever wrong. `relationship_types` sat empty for weeks; `family_roles` until
      # 20260817000003; the other two survived on luck.
      #
      # Asked of hosted on every deploy, because the damage is done by a script rather
      # than by the chain, so a migration-time assertion checks it exactly once. Same
      # position as the audit above: after `db push`, before the release, so a finding
      # holds the alias with the schema applied and the old code still serving.
      - name: Global lookups are populated
        run: supabase db query --linked -f supabase/scripts/audit_global_lookups.sql

      # GATING since 2026-08-12. This is the advisor that caught incident 2.
      #
      # `--level warn --fail-on error` is two decisions, not one: PRINT everything from warn
      # up, so the 7 `function_search_path_mutable` findings stay visible in the log, but
      # FAIL only on error.
      #
      # Flipped off `--fail-on none` on the strength of the local run rather than a hosted
      # one, which is worth being straight about: `db advisors --local --type security
      # --level error` reports **no issues**, and hosted runs the same migration chain, so
      # its schema-level errors should be the same set — empty. What local cannot show is a
      # project-level finding (leaked-password protection, MFA options), and those are WARN.
      #
      # If that inference is wrong, the failure is safe and self-diagnosing: this step runs
      # AFTER `db push` and BEFORE the release, so hosted gets the schema, the build stays
      # unaliased, the current production keeps serving, and the log names the finding.
      # `Force Promote` in Vercel releases it anyway if the finding is one you accept.
      - name: Security advisors
        run: supabase db advisors --linked --type security --level warn --fail-on error

      # ── THE AUTH EMAIL TEMPLATE PUSH WAS HERE, AND IT IS RETIRED — 2026-09-03 ──────────
      # A step named "Auth email templates match the repo" ran `npm run email:push` from here
      # between 2026-08-19 and today, for exactly the reason the migrations run from here: the
      # alternative was a laptop holding an account-wide Management API token.
      #
      # IT IS GONE BECAUSE THE THING IT PUSHED IS GONE. `[auth.hook.send_email]` is enabled on
      # hosted, so GoTrue renders none of its own bodies — `app/api/auth/send-email/route.ts`
      # composes all five from `lib/email/auth-mail.ts`, which is what makes them readable in
      # Spanish and French. `supabase/templates/*.html` were the fallback and were deleted with
      # the hook proven; the script that pushed them went with them.
      #
      # **LEAVING THE STEP WOULD HAVE HELD THE VERY NEXT RELEASE.** The script throws on a
      # `content_path` that does not exist and exits 2 — measured — and this job's name is what
      # Vercel binds its Deployment Check to, so the build would have been applied to the
      # database and never aliased, with the log naming a template rather than the deletion.
      # That is this file's own "a failure here holds the alias over mail copy" trade arriving
      # for copy that no longer exists.
      #
      # WHAT STILL HOLDS A COPY IS HOSTED, and it is worth knowing because nothing in the repo
      # says it any more: `email:push` only ever wrote, so the bodies it last pushed are still
      # stored on the project. Disabling the hook therefore falls back to CORRECT English mail
      # rather than to GoTrue's defaults — which link with `{{ .ConfirmationURL }}` and are
      # wrong for this app. There is no longer a repo copy of those bytes; recovering them is
      # a dashboard read.
      #
      # `supabase/templates/README.md` survives as the record and as the reference
      # `lib/email/layout.ts` mirrors. Do NOT re-add a push step without re-adding the bodies.

      # Nothing deploys from here. Vercel is already holding this commit's production
      # build; this job going green is what releases it. If you need to ship without the
      # gate — a schema problem you cannot fix quickly — use Force Promote on the
      # deployment in Vercel, deliberately and knowing what it skips.
      - name: Release
        run: |
          echo "Migrations applied and audited, auth email templates in step with the"
          echo "repo. Vercel's Deployment Check for"
          echo "\"Database migrations\" is now satisfied for ${GITHUB_SHA}, so the"
          echo "production build for this commit will be aliased automatically."
