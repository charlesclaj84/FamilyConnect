# How migrations reach the hosted project, and the gate that decides whether the code
# built from this commit is allowed to serve it.
#
# THE TWO INCIDENTS THIS EXISTS TO PREVENT
#
#   1. Code shipped ahead of schema. The dev server points at hosted, and Phase 3's app
#      code was deployed while its migrations were still pending. `getMyFamilies` selected
#      `membership_status`; hosted did not have the column; PostgREST answered 42703 and
#      killed the WHOLE query, not just that column. The resolver returned no memberships,
#      `requireViewOrPending` called `notFound()`, and every page in the app answered 404
#      — including the dashboard.
#
#   2. A migration was replayed by hand. `20260602000000_families.sql` was run against
#      hosted after `20260618000001` had renamed its policy to `perm:…`. Its bare
#      `CREATE POLICY` recreated the original alongside the secure one, and because
#      permissive policies are OR-ed, the spoofable `user_metadata` policy decided every
#      read until Supabase's advisor caught it.
#
# HOW ORDERING IS GUARANTEED — AND WHY IT IS NOT A DEPLOY HOOK
#
#   This workflow does NOT deploy anything. Vercel builds every push to `master` as usual,
#   and **Vercel Deployment Checks** hold that build unaliased until this job passes:
#
#     push to master ─┬─> Vercel builds a production deployment (NOT serving traffic)
#                     └─> this job: apply migrations, then audit
#                              │
#                         pass ├─> Vercel aliases the build to genorra.com, automatically
#                         fail └─> never aliased; the current production keeps serving
#
#   So the old code serves while migrations are applied — the safe direction, because a
#   migration this repo ships is additive and the running code does not use it yet — and
#   the new code is released only once the schema it needs is there.
#
#   The first design fired a Vercel deploy hook from the end of this job instead, with
#   Vercel's git auto-deploy for `master` turned off. That does not work, and the reason is
#   worth keeping so nobody rebuilds it: **deploy hooks are part of Vercel's git
#   integration.** Turn git deployments off and the hook stops firing too (the docs say so
#   for `github.enabled`, and Vercel support says so for the feature generally), so the
#   arrangement has only two states — auto-deploy on and the hook deploying a redundant
#   second time, or auto-deploy off and nothing deploying at all. Deployment Checks are the
#   supported mechanism for gating a release, and they require automatic aliasing to stay
#   **ON**, which is the opposite of what a hook needs.
#
#   Replay, meanwhile, is structural for a different reason: `supabase db push` records each
#   version in `supabase_migrations.schema_migrations` and refuses one already there.
#   Running it from here and nowhere else is what makes that ledger the truth. Guarding ~30
#   migration files individually was the alternative, and it is only ever as complete as the
#   last person's diligence.
#
#   Nobody needs write credentials on a laptop for any of this.

name: Migrate

on:
  push:
    branches: [master]
  # For re-running after a failure without an empty commit. The re-run writes a fresh
  # status onto the same commit, which is what Vercel's check is watching.
  workflow_dispatch:

# NEVER cancel a run that might be mid-`db push`. Two merges in quick succession must
# queue, not race — an interrupted push leaves the ledger disagreeing with the schema.
concurrency:
  group: production-migrate
  cancel-in-progress: false

jobs:
  migrate:
    # PINNED DELIBERATELY. Vercel identifies a Deployment Check by the GitHub check-run
    # name, which is this string — so it is the name to select in the project's Deployment
    # Checks settings, and renaming it silently detaches the gate, leaving every production
    # build waiting on a check that no longer reports. The docs call this out: "Changing
    # the name of a job requires updating your Deployment Checks to align with the names."
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The two production credentials live on THIS environment, not on the repository.
    # Repository secrets are readable by every workflow in the repo — including verify.yml,
    # which runs on `pull_request` from any branch a collaborator can push. verify.yml needs
    # no secret at all (checked: zero `secrets.` references), so scoping them here costs
    # nothing and means a PR cannot reach the production database password even by editing
    # its own workflow file.
    #
    # It also closes the `workflow_dispatch` path above: a dispatch runs the workflow file
    # from whatever ref you pick, so on repository secrets a modified copy of this file on a
    # branch could be handed production credentials. Set this environment's deployment
    # branch rule to `master` and that stops being true.
    #
    # Side benefit worth having: every run records a deployment against the environment, so
    # the Environments tab becomes the history of what reached production and when — the
    # "recorded" half of what this mechanism was for.
    environment: production

    env:
      # A Management API token (sbp_…) — not the service role key, not the DB password.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Read by `supabase link` and `db push` so neither prompts.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      # Fail with a sentence rather than with a CLI error forty lines down. A missing
      # secret is the single most likely reason this workflow breaks after somebody
      # rotates a token.
      - name: Preflight — required secrets are present
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN(secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ]  || missing="$missing SUPABASE_DB_PASSWORD(secret)"
          [ -n "$PROJECT_REF" ]           || missing="$missing SUPABASE_PROJECT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing — see TODO.md, \"GO LIVE\"."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # Same pin as verify.yml. Keep them in step: the CLI that proved the chain on a
          # PR should be the CLI that applies it to production.
          version: 2.114.0

      - name: Migration chain checks
        run: npm run db:check

      - name: Link
        run: supabase link --project-ref "$PROJECT_REF" --yes < /dev/null

      # Before touching anything: does hosted carry a version this repo does not (a
      # hand-applied file, or a `migration repair` stamp), and does anything pending sort
      # before what is already applied? Both are reasons to stop rather than push.
      - name: Ledger before
        run: npm run db:check -- --linked

      - name: What would be applied
        run: supabase db push --linked --dry-run --yes < /dev/null

      # `--yes` AND `< /dev/null`, and neither is decoration.
      #
      # `supabase db push --linked` DOES NOTHING FROM A NON-TTY — exit 0, no output, no
      # migrations applied — because it is sitting on a confirmation prompt it cannot
      # draw. AGENTS.md has recorded that since before this workflow existed, and a
      # GitHub runner is exactly that non-TTY. Without these, this job would go green
      # having applied nothing, the Deployment Check would pass, and Vercel would release
      # code against a schema that never changed: Phase 3's outage, reproduced faithfully
      # by the automation built to prevent it.
      #
      # NO --include-all, ever. `db push` refuses a pending migration that sorts before
      # the last one applied, and that refusal is a guard rather than an inconvenience:
      # every file applied after it was written against a schema that did not include it.
      # When it fires, the repair is a new migration with a current timestamp.
      - name: Apply migrations
        run: supabase db push --linked --yes < /dev/null

      # LOAD-BEARING, not a formality. This is what catches the silent no-op described
      # above if a future CLI reintroduces it in some other form: it re-reads the ledger
      # and fails when anything this repo carries is still pending. Failing here keeps the
      # Deployment Check red, so the build stays unaliased.
      - name: Ledger after — nothing may still be pending
        run: npm run db:check -- --linked --expect-applied

      # The check for incident 2, asked of hosted. A finding here holds the release with
      # schema applied and the old code still serving — the safe direction, since a
      # migration this repo ships is additive and the running code does not use it yet.
      #
      # The pinned binary directly, not `npm run db:audit`, which goes through `npx`.
      # The npm script is the convenience for a laptop; nothing that gates production
      # should depend on npx preferring a PATH command over fetching its own copy.
      - name: No superseded policy beside its replacement
        run: supabase db query --linked -f supabase/scripts/audit_policy_shadowing.sql

      # REPORT ONLY, deliberately. This is the advisor that caught incident 2, and it
      # should gate the release — but hosted's current advisor baseline has never been
      # read, so switching it to `--fail-on error` unverified would hold the first release
      # on findings that predate this workflow. Establish the baseline once by hand, then
      # change `none` to `error` here. TODO.md tracks it.
      - name: Security advisors (report only)
        run: supabase db advisors --linked --type security --level warn --fail-on none

      # Nothing deploys from here. Vercel is already holding this commit's production
      # build; this job going green is what releases it. If you need to ship without the
      # gate — a schema problem you cannot fix quickly — use Force Promote on the
      # deployment in Vercel, deliberately and knowing what it skips.
      - name: Release
        run: |
          echo "Migrations applied and audited. Vercel's Deployment Check for"
          echo "\"Database migrations\" is now satisfied for ${GITHUB_SHA}, so the"
          echo "production build for this commit will be aliased automatically."
