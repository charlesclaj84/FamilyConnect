# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "GENORRA"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000
# Controls whether new tables, views, sequences and functions created in the `public` schema by
# `postgres` are reachable through the Data API roles (`anon`, `authenticated`, `service_role`)
# without explicit GRANTs. When unset, new entities are NOT auto-exposed, matching the new cloud
# default. Set to `true` to keep the legacy behaviour of auto-exposing new entities; this is
# deprecated and the field is removed on 2026-10-30 once the always-revoked behaviour is permanent.
# auto_expose_new_tables = true

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false
# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files, directories, or glob patterns that describe your database.
# Supports paths relative to supabase directory: "./schemas/*.sql", "./database".
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false
# List of IPv4 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv4 connections. Set empty array to block all IPs.
allowed_cidrs = ["0.0.0.0/0"]
# List of IPv6 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv6 connections. Set empty array to block all IPs.
allowed_cidrs_v6 = ["::/0"]

# Uncomment to reject non-secure connections to the database.
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Uncomment to configure local storage buckets
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Allow connections via S3 compatible clients
[storage.s3_protocol]
enabled = true

# Image transformation API is available to Supabase Pro plan.
# [storage.image_transformation]
# enabled = true

# Store analytical data in S3 for running ETL jobs over Iceberg Catalog
# This feature is only available on the hosted platform.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets is available to Supabase Pro plan.
# [storage.analytics.buckets.my-warehouse]

# Store vector embeddings in S3 for large and durable datasets
[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

# Vector Buckets is available to Supabase Pro plan.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
#
# 2026-08-10: moved off genorra-kappa.vercel.app to the purchased domain. The vercel.app
# host must now REDIRECT here rather than serve in parallel — two origins serving the
# same app is how a confirmation link writes its session cookie on the origin the user
# just left, landing them signed out on a dashboard with nothing explaining why.
site_url = "https://genorra.com"
# The public URL that Auth serves on. Defaults to the API external URL with `/auth/v1` appended.
# external_url = ""
# A list of *exact* URLs that auth providers are permitted to redirect to post
# authentication.
#
# WILDCARDED ON PURPOSE. This list governs the `redirectTo` / `emailRedirectTo` argument
# passed to an auth call — today that is exactly one site, `resetPasswordForEmail` in
# ForgotPasswordForm — and an allow-list that has to be extended every time a route is
# added is an allow-list that will silently be wrong the first time somebody forgets.
# `https://genorra.com/**` is same-origin by construction, so it is not an open redirect;
# what stops `?next=` being one is lib/safe-next.ts, which is a separate control and the
# one actually doing that job.
#
# NOT NEEDED HERE: the confirmation email's link. The template writes
# `{{ .SiteURL }}/auth/confirm?...` as a plain href, so it is a navigation to our own
# origin and never passes through GoTrue's redirect check.
#
# NOTE FOR LOCAL DEVELOPMENT: site_url above points at the deployed origin, so
# `{{ .SiteURL }}` in the confirmation template resolves there too — a signup against
# the LOCAL stack produces a Mailpit message whose link goes to genorra.com, not to
# 127.0.0.1:3000. That is fine when the intent is to configure hosted, and confusing if
# you are trying to click through a local signup. To test the flow locally, point
# site_url back at http://127.0.0.1:3000 and add the matching origins here — both
# `127.0.0.1` and `localhost`, which are different origins to a browser.
#
# The invitation links built by InviteMemberDialog are unaffected either way: they are
# composed from window.location.origin in the browser, not from this setting.
additional_redirect_urls = [
  "https://genorra.com/**"
]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# JWT issuer URL. If not set, defaults to auth.external_url.
# jwt_issuer = ""
# Path to JWT signing key. DO NOT commit your signing keys file to git.
# signing_keys_path = "./signing_keys.json"
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
minimum_password_length = 6
# Passwords that do not meet the following requirements will be rejected as weak. Supported values
# are: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
password_requirements = ""

# Configure passkey sign-ins.
# [auth.passkey]
# enabled = false

# Configure WebAuthn relying party settings (required when passkey is enabled).
# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

[auth.rate_limit]
# Number of emails that can be sent per hour. Requires auth.email.smtp to be enabled.
#
# RAISED FROM 2 TO 30, 2026-08-10, at the same time as custom SMTP. With confirmations on,
# this cap sits directly in the signup path: the third person to join in an hour gets no
# email, and the resend button they are shown appears to do nothing. Two was Supabase's
# figure for its shared built-in sender, not a judgement about this app; a family onboarding
# together in one sitting clears it before lunch.
#
# Set this in the DASHBOARD too (Authentication → Rate Limits). Hosted does not read this
# file — see the SMTP block below for why config push is not the way to get it there.
email_sent = 30
# Number of SMS messages that can be sent per hour. Requires auth.sms to be enabled.
sms_sent = 30
# Number of anonymous sign-ins that can be made per hour per IP address. Requires enable_anonymous_sign_ins = true.
anonymous_users = 30
# Number of sessions that can be refreshed in a 5 minute interval per IP address.
token_refresh = 150
# Number of sign up and sign-in requests that can be made in a 5 minute interval per IP address (excludes anonymous users).
sign_in_sign_ups = 30
# Number of OTP / Magic link verifications that can be made in a 5 minute interval per IP address.
token_verifications = 30
# Number of Web3 logins that can be made in a 5 minute interval per IP address.
web3 = 30

# Configure one of the supported captcha providers: `hcaptcha`, `turnstile`.
# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
#
# TURNED ON 2026-08-06, together with the confirmation route and template below.
# It could not be flipped on its own: with it false, GoTrue stamps email_confirmed_at
# at signup, so every check against that column passed trivially — which is why Phase 3
# shipped its email checks inert and said so. They are live now.
#
# What this changes at runtime:
#   * signUp() returns a user but NO session, so RegisterForm's auto sign-in fails and
#     it shows its "Check your email" screen. That branch already existed.
#   * signInWithPassword() returns "Email not confirmed" until they click the link.
#   * join_family_by_code() (20260806000011 §7b) now genuinely refuses an unconfirmed
#     account, and PendingApprovalScreen renders its resend panel for one.
enable_confirmations = true
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
#
# TRUE since 2026-08-11, and it had to be — measured, not reasoned.
#
# WHAT IT ACTUALLY DOES, measured against a local stack rather than reasoned about. Read
# the line above literally: "reauthenticate OR HAVE LOGGED IN RECENTLY". The second half
# is the whole story, and it is not what an earlier note here claimed.
#
#   session age    wrong code                              correct code
#   ------------   -------------------------------------   ------------
#   fresh (<24h)   ACCEPTED — reauthentication skipped     accepted
#   3 days old     refused, "Nonce has expired or is       accepted
#                  invalid"
#
# So for a session under GoTrue's recent-login window the emailed code is not checked at
# all, whatever this flag says — supplying a deliberately wrong one still changes the
# password. The flag bites only on older sessions.
#
# That is still worth having on, because it is aimed at exactly the case it covers: an
# unattended session someone else sits down at days later. A member whose session is
# minutes old proved their password minutes ago, and GoTrue treating that as equivalent
# reauthentication is defensible. What is NOT defensible is claiming the code is a gate in
# both cases — components/personal-info/SignInSecurity.tsx says so plainly.
#
# THE RECOVERY PATH SURVIVES IT, which was the open question that kept this false for a
# day. generateLink(recovery) -> verifyOtp -> updateUser({ password }) with NO nonce is
# accepted and the new password then signs in, because a recovery session is fresh by
# construction. /forgot-password -> /update-password is unaffected.
#
# Re-run the probe if you change this. Both failure modes are silent: turning it off stops
# checking without any error, and turning it on breaks nothing visible until somebody with
# an old session tries to change a password.
secure_password_change = true
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
#
# DELIBERATELY DIFFERENT FROM HOSTED, which is 60s. This is the floor between two
# confirmation or reset emails to the same address; 1s makes local iteration bearable and
# 60s is the right production value. Recorded because the 2026-08-12 sweep found three
# [auth] divergences and this was the only intended one — an unrecorded intentional
# divergence is indistinguishable from the two that were bugs.
max_frequency = "1s"
# Number of characters used in the email OTP.
#
# EIGHT, NOT SIX, and matched to hosted 2026-08-12. This is the length of the {{ .Token }}
# in the reauthentication email, so it is a LAYOUT constant as much as a security one:
# supabase/templates/reauthentication.html sets the code in monospace at a size chosen to
# fit this many characters inside a 320px phone WITHOUT the <style> block, which Gmail
# strips for non-Gmail accounts. Raising it again means re-measuring that block — the
# arithmetic is in a comment beside it.
otp_length = 8
# Number of seconds before the email OTP expires (defaults to 1 hour).
otp_expiry = 3600

# Use a production-ready SMTP server
#
# HOSTED SENDS THROUGH RESEND AS OF 2026-08-10. The settings live in the dashboard
# (Authentication → Emails → SMTP Settings), not here, and this block stays commented
# out. Two separate reasons, and only the first is the familiar one:
#
#   1. `supabase config push` sends the whole [auth] block, site_url included. TODO.md's
#      GO LIVE section says so; the failure it prevents is production mailing people
#      links to somebody's laptop.
#   2. Uncommenting this changes LOCAL behaviour, which is the part that surprises. The
#      CLI routes local mail through whatever [auth.email.smtp] names, so an enabled
#      block takes local development off Mailpit ([local_smtp] above, port 54324) and
#      starts delivering real mail to real addresses out of `db reset` and the test
#      fixtures. Local signups are meant to be inspectable, not delivered.
#
# Recorded here so the hosted values are reviewable in the repo. To genuinely test real
# delivery from a local stack, uncomment temporarily and export RESEND_SMTP_PASSWORD —
# then put it back.
#
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 587
# user = "resend"                          # literally the word; Resend's SMTP username is fixed
# pass = "env(RESEND_SMTP_PASSWORD)"       # the re_… API key — there is no separate password
# admin_email = "support@genorra.com"
# sender_name = "GENORRA"

# THIS TABLE IS ALSO WHAT REACHES PRODUCTION. The five blocks below are read by the
# local stack AND by `npm run email:push` (scripts/auth-templates.mjs), which sends each
# subject and body to the hosted project through the Management API. So this stays the
# one statement of which file is which template — adding a template here is what makes it
# pushable, and `npm run email:check` reports any hosted template that has drifted from
# its file.
#
# It is NOT `supabase config push`, deliberately: that sends this whole [auth] block,
# site_url included. The script sends ten fields and refuses to transmit anything outside
# mailer_subjects_* / mailer_templates_*_content. See supabase/templates/README.md.
#
# The sign-up confirmation email. Overridden rather than left to the default because
# the default links to GoTrue's own /auth/v1/verify, which returns the session in a URL
# fragment — never sent to the server, so a cookie-based app gets a confirmed account
# and no session. Ours links to /auth/confirm with a token_hash instead. See
# app/auth/confirm/route.ts for the full argument.
#
# ALL FIVE SUBJECTS BELOW WERE RECOVERED FROM THE DASHBOARD, 2026-08-12, on the first
# real run of `npm run email:check` — which found every one of them drifted and the
# bodies matching. That asymmetry is worth keeping in mind: the body is what gets edited
# in the repo, and the SUBJECT is what gets edited in the dashboard, because it is the
# field sitting right there in the form above it. Whoever pasted the templates rewrote
# all five in passing, and those rewrites existed nowhere but production.
#
# They are better than what was here, which is why they were adopted rather than
# overwritten: each leads with the product name, so the message is identifiable in a
# crowded inbox before the preheader is read, and each carries the voice the README asks
# for ("You're almost in" is the <h1> of the confirmation mail). The hyphen is a plain
# ASCII "-" on purpose — an em dash in a Subject: header is one more thing to be mangled
# by a client that gets the encoding wrong.
[auth.email.template.confirmation]
subject = "GENORRA - You're almost in"
content_path = "./supabase/templates/confirmation.html"

# The remaining four, added 2026-08-11. Every one of GoTrue's defaults links with
# {{ .ConfirmationURL }}, so leaving any of them stock means the first person to use that
# flow hits the fragment bug described above — a confirmed action and no session. They
# are overridden together for that reason, not because all four are in use.
#
# WHAT CALLS EACH, as of 2026-08-11 (three were dormant when they were written):
#   confirmation     sign-up
#   recovery         resetPasswordForEmail -> /auth/confirm -> /update-password
#   email_change     auth.updateUser({ email })  — Sign-in & Security on My Profile
#   reauthentication auth.reauthenticate()       — same section, before a password change
#   invite           STILL UNUSED — nothing calls auth.admin.inviteUserByEmail()
#
# `invite` is NOT the family invitation email, which is why it is the one left dormant.
# That flow is family_invitations + InviteMemberDialog + /invite/<token>, and since
# 2026-08-11 it emails through lib/email/ over Resend's HTTP API — an application-level
# send, because GoTrue knows nothing about families, family codes or pre-approval. The
# template stays overridden so a future inviteUserByEmail() cannot fall back to GoTrue's
# default and reintroduce the fragment bug.

[auth.email.template.recovery]
subject = "GENORRA - Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "GENORRA - Your family kept a place for you"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "GENORRA - Confirm your new address"
content_path = "./supabase/templates/email-change.html"

# No link in this one — GoTrue sends an 8-character .Token (otp_length above; the block
# that renders it is sized for exactly that). The subject deliberately does NOT
# say "code": it is the one of the five that can arrive unrequested, and "Just checking
# it's you" reads as a question rather than as something to act on. The body carries the
# warning that we never ask for it by phone, text or email.
[auth.email.template.reauthentication]
subject = "GENORRA - Just checking it's you"
content_path = "./supabase/templates/reauthentication.html"

# Uncomment to customize notification email template
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./templates/password_changed_notification.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }}"
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure logged in session timeouts.
#
# BOTH OFF DELIBERATELY, and read the trap below before turning the first one on.
#
# A TIMEBOX AT OR UNDER 24h SILENTLY DISABLES `secure_password_change`. That flag (in
# [auth.email], ~200 lines up) is enforced only on sessions GoTrue considers stale, and
# its staleness test is `session.created_at + 24h`. Cap every session at 24h and no
# session can ever reach that age — so the emailed reauthentication code stops being
# checked for anybody, the flag becomes decoration, and nothing anywhere errors. The two
# settings look unrelated and are a hundred lines apart; this is the note saying they
# are not.
#
# So if a timebox is wanted, pick a duration comfortably OVER 24h. Do not reach for the
# current-password field on the Password panel as the replacement: that check runs in the
# browser and GoTrue's endpoint is reachable without it, so it raises the bar rather than
# holding a line. AGENTS.md, "A fresh session can change the password without the emailed
# code", has the whole picture.
#
# `inactivity_timeout` does NOT have the timebox problem — it never caps `created_at`, so it
# leaves the reauthentication window alone. What it does and does not buy was MEASURED
# against a local stack on 2026-08-12, at a 60-second window so the experiment took a
# minute; four results, and the last two are the ones that decide how to describe it.
#
#   A. A session nobody refreshed dies at the window, explicitly:
#      "Invalid Refresh Token: Session Expired (Inactivity)".
#   B. A client that keeps refreshing survives it indefinitely — three automatic refreshes
#      inside a 60s window, no user activity whatever. It measures CLIENT activity, not the
#      person's, and `autoRefreshToken` is on for every browser client we create.
#   C. The access token issued BEFORE the window still works at GoTrue `/user` afterwards.
#   D. And still reads data through PostgREST — HTTP 200. PostgREST verifies the JWT
#      signature and knows nothing about GoTrue sessions.
#
# So it is a RENEWAL CUTOFF, not a kill switch: for up to `jwt_expiry` (an hour) after a
# session dies of inactivity, the token already in hand keeps working everywhere. The only
# thing that kills a session on the spot is an explicit signOut, which revokes.
#
# TWO CONSEQUENCES.
#
# 1. IT IS NOT THE APP'S INACTIVITY SIGN-OUT and cannot be. That is
#    components/layout/IdleTimeout.tsx — a client timer, IDLE_LIMIT_MINUTES in
#    lib/idle-timeout.ts. By result B an open tab keeps its session fresh however long the
#    human has been gone, so this setting never fires for the case that component exists
#    for; and it cannot navigate anybody to /login either. They are complements: the timer
#    covers a person who walked away from an open tab, this covers a browser that is not
#    running at all.
#
# 2. THE VALUE HAS A FLOOR, and it is about an hour. auth-js refreshes when the access
#    token is within ~90s of expiry, so at `jwt_expiry = 3600` a live tab refreshes roughly
#    every 58 minutes. Set this BELOW that and active members are signed out mid-sentence,
#    because by result B the only clock it watches is the refresh. Note that the idle timer
#    is no help in picking a value here — it is 60m, matching `jwt_expiry`, which leaves
#    only ~90s over that refresh cadence and so clears the floor by nothing worth relying
#    on. Hours clear it comfortably; that is what this setting is for.
#
# WHAT IT IS ACTUALLY FOR, then: today a session cookie has no expiry at all, so a browser
# closed while signed in stays signed in forever — the shared family computer somebody used
# once. Any value here bounds that, and the choice is purely how often members must sign in
# again versus how long an abandoned cookie stays renewable. 8h means most visits; 7d bounds
# abandonment to a week while keeping "remember me" for regulars.
#
# Pro plan and up on hosted, and hosted does not read this file — set it in the dashboard
# (Authentication -> Sessions). See TODO.md's GO LIVE list, which tracks it as a hosted
# setting rather than a code change.
# https://supabase.com/docs/guides/auth/sessions
[auth.sessions]
# SEVEN DAYS, chosen 2026-08-12. A member who has not been near the product for a week
# signs in again; an abandoned cookie on a shared machine stops being renewable after one.
#
# NOTE THE UNIT: Go's duration parser has no `d`, so seven days is written as hours. `168d`
# is not a long timeout, it is a parse error, and `7` on its own is 7 nanoseconds.
#
# Comfortably above the ~58-minute refresh cadence this has to clear (jwt_expiry / 3600s,
# less auth-js's ~90s margin), so it cannot sign out somebody who is actively working —
# which is the one way to get this wrong. The measured reasoning is above.
inactivity_timeout = "168h"
# Force log out after the specified duration.
#
# LEFT OFF DELIBERATELY. Unlike the setting above, this one caps `session.created_at`, and
# any value at or under 24h means no session can reach the age at which GoTrue starts
# demanding the reauthentication code — `secure_password_change` becomes decoration with
# nothing anywhere reporting it. If a timebox is ever wanted, pick a duration well over 24h.
# timebox = "24h"

# This hook runs before a new user is created and allows developers to reject the request based on the incoming user object.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Multi-factor-authentication is available to Supabase Pro plan.
[auth.mfa]
# Control how many MFA factors can be enrolled at once per user.
max_enrolled_factors = 10

# Control MFA via App Authenticator (TOTP)
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Configure MFA via Phone Messaging
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth callback URL derived from auth.external_url.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false
# If enabled, it will allow the user to successfully authenticate when the provider does not return an email address.
email_optional = false

# Allow Solana wallet holders to sign in to your project via the Sign in with Solana (SIWS, EIP-4361) standard.
# You can configure "web3" rate limit in the [auth.rate_limit] section and set up [auth.captcha] if self-hosting.
[auth.web3.solana]
enabled = false

# Use Firebase Auth as a third-party provider alongside Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 as a third-party provider alongside Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) as a third-party provider alongside Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk as a third-party provider alongside Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtain from https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# OAuth server configuration
[auth.oauth_server]
# Enable OAuth server functionality
enabled = false
# Path for OAuth consent flow UI
authorization_url_path = "/oauth/consent"
# Allow dynamic client registration
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# pg-delta is the schema diff engine for db diff / db pull / db remote commit.
# Set enabled = false to fall back to the legacy migra engine.
[experimental.pgdelta]
enabled = true
# Directory under `supabase/` where declarative files are written.
# declarative_schema_path = "./database"
# JSON string passed through to pg-delta SQL formatting.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":80,\"commaStyle\":\"trailing\"}"
